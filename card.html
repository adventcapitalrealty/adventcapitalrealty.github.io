<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabe Martinez | Real Estate Broker | Advent Capital Realty</title>
<link rel="icon" type="image/png" href="img/logo.png">
<meta name="description" content="Digital business card for Gabe Martinez, Real Estate Broker at Advent Capital Realty, Southern California. CA DRE #01501814. Se habla español.">
<style>
  :root{--maroon:#331812; --gold:#a34a28; --gold-dark:#7c3a1e; --paper:#ead1c6; --card:#f9ece4; --line:#d8b8a8; --ink:#1c1210}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Georgia,'Times New Roman',serif;background:var(--maroon);color:#f7ece4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 18px}
  .card{background:var(--card);color:var(--ink);max-width:420px;width:100%;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:6px;padding:40px 30px 34px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .logo{height:64px;width:auto;margin-bottom:18px}
  .wordmark{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:26px}
  h1{font-size:2.2rem;font-weight:normal;line-height:1.1}
  .title{font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-top:8px}
  .dre{font-size:.85rem;color:#6b4f44;margin-top:6px}
  .qr{width:220px;height:220px;margin:26px auto 10px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;display:block}
  .scan{font-size:.8rem;font-style:italic;color:#6b4f44;margin-bottom:22px}
  .save{display:inline-block;background:var(--gold);color:#f9ece4;text-decoration:none;padding:13px 30px;font-size:.82rem;font-weight:bold;letter-spacing:.15em;text-transform:uppercase;border-radius:2px;margin-bottom:26px}
  .save:hover{background:var(--gold-dark)}
  .lines{border-top:1px solid var(--line);padding-top:22px;font-size:1rem;line-height:2}
  .lines a{color:var(--ink);text-decoration:none}
  .lines a:hover{color:var(--gold)}
  .esp{display:inline-block;margin-top:14px;font-size:.78rem;letter-spacing:.1em;color:var(--gold);border:1px solid var(--line);border-radius:2px;padding:4px 12px}
  .area{margin-top:18px;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#9c7f72}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="img/logo.png" alt="Advent Capital Realty">
    <div class="wordmark">Advent Capital Realty</div>
    <h1>Gabe Martinez</h1>
    <div class="title">Real Estate Broker</div>
    <div class="dre">CA DRE # 01501814</div>
    <img class="qr" src="img/qr-card.png" alt="QR code - scan to save Gabe's contact">
    <div class="scan">Scan with your phone camera to save my contact</div>
    <a class="save" href="contact.vcf">Save Contact</a>
    <div class="lines">
      <div><a href="tel:+19518470694">951-847-0694</a></div>
      <div><a href="mailto:brokergabe@gmail.com">brokergabe@gmail.com</a></div>
      <div><a href="https://gabemartinezre.com">gabemartinezre.com</a></div>
    </div>
    <div class="esp">Se habla español</div>
    <div class="area">Serving Southern California</div>
  </div>
</body>
</html>
